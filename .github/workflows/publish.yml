name: Publish Release
env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout signalwire-typescript
        uses: actions/checkout@v7
        with:
          path: signalwire-typescript

      - name: Checkout porting-sdk (mock_relay test harness)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          # Publish always builds against porting-sdk main — deliberately NOT the
          # coordinated-pass .github/porting-sdk-ref pin, so a release can never ship from
          # an unmerged wave branch (see porting-sdk/COORDINATED_PASS.md).
          ref: main
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Checkout signalwire-python (Layer-D oracle source)
        uses: actions/checkout@v7
        with:
          repository: signalwire/signalwire-python
          path: signalwire-python

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: signalwire-typescript/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python test harnesses (mock_relay + mock_signalwire)
        run: |
          pip install -e porting-sdk/test_harness/mock_relay
          pip install -e porting-sdk/test_harness/mock_signalwire

      # The rest of the setup mirrors test.yml, so the gate battery below runs
      # as it does on a PR: the reference SDK for the oracle gates, the HTTP
      # backends the SWAIG-HTTP and AI-CHAT-GATEWAY gates import, and the
      # actionlint binary the ACTIONLINT gate needs.
      - name: Install signalwire-python (EMISSION oracle) if not importable
        run: |
          if python -c "import signalwire.core.function_result" 2>/dev/null; then
            echo "signalwire-python already importable; skipping install"
          else
            pip install ./signalwire-python
          fi

      - name: Install gate HTTP backends (httpx2 for TestClient, httpx for AI-CHAT-GATEWAY)
        run: pip install httpx httpx2

      - name: Install actionlint (ACTIONLINT gate)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv ./actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: npm ci
        working-directory: signalwire-typescript
        run: npm ci

      # Run the FULL CI gate battery before releasing, so a release is gated on
      # the same checks a PR is. run-ci.sh resolves the adjacent porting-sdk
      # checkout above and runs every gate; a red gate fails the job and blocks
      # the release step below.
      - name: Run CI gates (blocking)
        working-directory: signalwire-typescript
        env:
          CI: "true"
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
          PORTING_SDK_PATH: ${{ github.workspace }}/porting-sdk
        run: bash scripts/run-ci.sh

      # Trusted publishing: npm authenticates this workflow through GitHub's OIDC
      # token (the job's id-token: write permission), so no npm token is stored
      # in the repo. The package's trusted publisher on npmjs.com names this
      # repository and publish.yml. It needs npm 11.5.1 or later, and publishes
      # with provenance.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: npm publish
        working-directory: signalwire-typescript
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

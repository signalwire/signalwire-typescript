name: Publish Release
env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout signalwire-typescript
        uses: actions/checkout@v7
        with:
          path: signalwire-typescript

      - name: Checkout porting-sdk (mock_relay test harness)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          path: porting-sdk
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Checkout signalwire-python (Layer-D oracle source)
        uses: actions/checkout@v7
        with:
          repository: signalwire/signalwire-python
          path: signalwire-python

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: signalwire-typescript/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python test harnesses (mock_relay + mock_signalwire)
        run: |
          pip install -e porting-sdk/test_harness/mock_relay
          pip install -e porting-sdk/test_harness/mock_signalwire

      - name: npm ci
        working-directory: signalwire-typescript
        run: npm ci

      # Run the FULL CI gate battery before releasing, so a release is gated on
      # the same checks a PR is. run-ci.sh resolves the adjacent porting-sdk
      # checkout above and runs every gate; a red gate fails the job and blocks
      # the release step below.
      - name: Run CI gates (blocking)
        working-directory: signalwire-typescript
        env:
          CI: "true"
          PORTING_SDK: ${{ github.workspace }}/porting-sdk
          PORTING_SDK_PATH: ${{ github.workspace }}/porting-sdk
        run: bash scripts/run-ci.sh

      - name: npm publish
        working-directory: signalwire-typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
